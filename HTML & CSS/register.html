<!DOCTYPE html> <!--this means the type of html. this means html5-->    

<html lang="en">
    <head>
        <title>
            Registration
        </title>
    </head>

    <body>
       <form>
            <input autocomplete="off" autofocus name="email" placeholder="Email" type="email"> <!--email is a type now a days-->
            <button>
                Register
            </button>

            <input autocomplete="off" autofocus name="Phone" pattern="\+880\d{10}" placeholder="Phone"> <!-- \ means "." It means manual-->
            <button>
                Register
            </button>
       </form>
    </body>
</html>
